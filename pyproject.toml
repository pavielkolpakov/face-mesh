[project]
name = "face-mesh"
version = "0.1.0"
description = "Photo to Unity blendshapes worker"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mediapipe==0.10.14",
    "opencv-python>=4.13.0.92",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "supabase>=2.5",
    "python-json-logger>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
face-mesh = "face_mesh.cli.main:app"
face-mesh-worker = "face_mesh.worker.loop:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
ignore = ["E702", "E402", "B008", "N806", "N803"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402", "E702", "N806", "N803", "B007"]
"src/**" = ["N803", "N806"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
